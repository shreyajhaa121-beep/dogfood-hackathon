
[portal]
base_url = "http://localhost:8080"

[tiers]
claimed = ["T1", "T2"]
pitch = "A self-hostable hackathon portal with a public project gallery, role-protected judging scores, and organizer CSV export."

[auth]
organizer = "Authorization: Bearer organizer-demo"
judge_a = "Authorization: Bearer judge-a-demo"
judge_b = "Authorization: Bearer judge-b-demo"
participant = "Authorization: Bearer participant-demo"

[routes]
gallery = "/projects"
submit = "/projects/new"
judge_scores = "/api/judge/scores"
peer_scores = "/api/judge/scores?judge=judge_a"
csv_export = "/api/export.csv"
